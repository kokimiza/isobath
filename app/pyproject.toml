[project]
name = "isobath"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "numpy>=2.0",
    "tzdata>=2024.1",  # zoneinfo on Windows (no system tz database)
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
pipeline = ["pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "factor-analyzer>=0.5", "matplotlib>=3.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["models"]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
# Explicit selection: Ruff's defaults change between releases.
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "UP",           # pyupgrade (target-version)
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "PIE", "PERF", "FURB",
    "RET",          # return statements
    "PTH",          # pathlib over os.path
    "DTZ",          # timezone-aware datetimes
    "S",            # bandit (security)
    "ASYNC",
    "PT",           # pytest style
    "N",            # naming
    "TC",           # typing-only imports
    "LOG", "G",     # logging
    "T20",          # no print()
    "ERA",          # commented-out code
    "PL",           # pylint
    "RUF",
]
ignore = [
    "E501",     # line length is the formatter's job
    "PLR0911",  # too many returns / branches / args / statements:
    "PLR0912",  #   readability is judged in review, not by counts
    "PLR0913",
    "PLR0915",
    "PLR2004",  # magic values: statistical thresholds are named where they matter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "PLC0415"]
# random is used for experimental design (question assignment), not for secrets
"isobath/survey/assign.py" = ["S311"]
"isobath/routers/surveys.py" = ["S311"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are immutable by design (B008)
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "isobath.ratelimit.limit",  # returns a dependency function
]

[tool.ruff.lint.isort]
known-first-party = ["isobath", "pipeline"]

[tool.ruff.lint.pep8-naming]
# Lambda, P, S, C: conventional matrix names in the factor model
ignore-names = ["Lambda", "L", "P", "S", "C"]
