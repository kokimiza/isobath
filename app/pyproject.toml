[project]
name = "isobath"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
pipeline = ["pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "factor-analyzer>=0.5", "matplotlib>=3.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework idiom
